name: Pokémon card prices

on:
  schedule:
    - cron: "17 12 * * *"  # daily, 12:17 UTC
  workflow_dispatch:       # the checklist page's Refresh button starts this

permissions:
  contents: write

concurrency:
  group: pokemon-prices

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pokemon-prices/update_prices.py
      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon-prices/prices.json pokemon-prices/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Pokémon card prices"
          git push
